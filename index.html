<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M7 Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap');

        :root {
            --bg-deep: #05070b;
            --surface: rgba(19, 27, 46, 0.85);
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.6);
            --accent: #3b82f6;
            --success: #10b981;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            overflow-x: hidden;
        }

        #welcomeIntro {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a103c 0%, #05070b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            animation: cinematicFadeOut 0.7s cubic-bezier(0.77, 0, 0.175, 1) 1.4s forwards;
        }

        .cinematic-glow {
            position: absolute;
            width: 160px;
            height: 160px;
            background: var(--primary);
            filter: blur(90px);
            border-radius: 50%;
            animation: pulseGlow 2s infinite alternate;
        }

        .intro-logo-box, .profile-logo {
            cursor: pointer;
            user-select: none;
        }

        .intro-logo-box {
            position: relative;
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 800;
            color: white;
            box-shadow: 0 0 40px var(--primary-glow);
            animation: introLogoAnim 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .intro-title {
            margin-top: 20px;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: introTextAnim 0.8s ease 0.2s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .intro-sub {
            font-size: 13px;
            color: #38bdf8;
            margin-top: 6px;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: introTextAnim 0.8s ease 0.4s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes introLogoAnim {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            70% { transform: scale(1.1) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes introTextAnim { to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { from { transform: scale(0.8); opacity: 0.5; } to { transform: scale(1.2); opacity: 0.9; } }
        @keyframes cinematicFadeOut { to { opacity: 0; visibility: hidden; } }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--surface);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 16px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(26, 34, 56, 0.7);
            padding: 14px 18px;
            border-radius: 18px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
        }

        .balance-box-top {
            background: rgba(19, 27, 46, 0.9);
            border: 1px solid rgba(34, 197, 94, 0.4);
            padding: 8px 14px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .balance-box-top span { font-size: 11px; color: var(--text-muted); }
        .balance-box-top h3 { margin: 0; color: var(--success); font-size: 16px; font-weight: 700; }

        .profile-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .profile-info .name { font-weight: 700; font-size: 14px; }
        .profile-info .id {
            font-size: 12px;
            color: #38bdf8;
            font-weight: 700;
            cursor: pointer;
            margin-top: 2px;
        }

        .lang-dropdown-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 12px;
        }

        .lang-drop-btn {
            background: rgba(26, 34, 56, 0.8);
            color: white;
            border: 1px solid var(--border);
            padding: 7px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lang-content {
            display: none;
            position: absolute;
            min-width: 140px;
            background: #131b2e;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.6);
            border-radius: 12px;
            z-index: 99;
            border: 1px solid var(--border);
            overflow: hidden;
            margin-top: 5px;
        }

        [dir="rtl"] .lang-content { right: 0; }
        [dir="ltr"] .lang-content { left: 0; }

        .lang-content button {
            color: white;
            padding: 10px 14px;
            display: block;
            width: 100%;
            background: none;
            border: none;
            text-align: inherit;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .lang-content button:hover { background: var(--primary); }
        .show { display: block; }

        .menu-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        .menu-btn {
            flex: 1;
            background: rgba(26, 34, 56, 0.7);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 12px 6px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            text-align: center;
            font-size: 12px;
            transition: all 0.25s ease;
        }

        .menu-btn.active {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
        }

        .section-title {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .platforms-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .platform-card {
            background: rgba(26, 34, 56, 0.6);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .platform-card:hover, .platform-card.selected {
            border-color: var(--primary);
            background: rgba(34, 45, 74, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }

        .platform-icon-box {
            width: 38px;
            height: 38px;
            margin: 0 auto 6px auto;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .platform-icon-box svg { width: 21px; height: 21px; fill: currentColor; }
        .platform-card span.title { display: block; font-size: 11.5px; font-weight: 700; color: #fff; }

        .types-grid {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 16px;
            padding-bottom: 5px;
        }

        .type-pill {
            background: rgba(26, 34, 56, 0.6);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
        }

        .type-pill.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .order-card-box {
            background: rgba(26, 34, 56, 0.6);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 15px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }

        .form-control {
            width: 100%;
            padding: 12px;
            background: rgba(13, 19, 33, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }

        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 12px var(--primary-glow); }
        
        .service-details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: rgba(13, 19, 33, 0.7);
            padding: 12px;
            border-radius: 14px;
            text-align: center;
            margin-top: 12px;
            border: 1px solid var(--border);
        }

        .detail-item div:first-child { font-size: 10px; color: var(--text-muted); }
        .detail-item div:last-child { font-size: 12px; font-weight: 700; color: var(--accent); margin-top: 4px; }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 12px;
            font-size: 14px;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .payment-method-box {
            background: rgba(13, 19, 33, 0.88);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .copy-btn {
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .history-item {
            background: rgba(13, 19, 33, 0.85);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
        }

        #adminModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 11, 0.94);
            z-index: 999999;
            justify-content: center;
            align-items: center;
        }
        .admin-box {
            background: #131b2e;
            border: 2px solid var(--primary);
            padding: 20px;
            border-radius: 20px;
            width: 92%;
            max-width: 440px;
            box-shadow: 0 0 35px var(--primary-glow);
            max-height: 90vh;
            overflow-y: auto;
        }

        .pending-order-card {
            background: rgba(13, 19, 33, 0.9);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        #msg { text-align: center; font-size: 12px; margin-top: 10px; font-weight: 600; }
    </style>
</head>
<body>

    <div id="welcomeIntro">
        <div class="cinematic-glow"></div>
        <div class="intro-logo-box" onclick="handleLogoClick()">M7</div>
        <div class="intro-title">M7 STORE</div>
        <div class="intro-sub">Next-Gen Digital Hub</div>
    </div>

    <div id="adminModal">
        <div class="admin-box">
            <h3 style="margin-top: 0; color: var(--primary);">⚙️ Admin Panel (M7 Store)</h3>
            
            <div class="form-group" style="background: rgba(139, 92, 246, 0.12); padding: 12px; border-radius: 12px; border: 1px solid var(--primary);">
                <label style="color: #a78bfa; font-weight: bold;">➕ Add Balance by User ID:</label>
                <input type="text" id="targetUserId" class="form-control" placeholder="User Telegram ID" style="margin-bottom: 8px;">
                <input type="number" step="0.5" id="addBalanceAmount" class="form-control" placeholder="Amount ($) e.g. 10" style="margin-bottom: 8px;">
                <button class="submit-btn" style="padding: 10px; margin-top: 2px;" onclick="adminAddBalance()">Send Balance to ID 🚀</button>
            </div>

            <div class="form-group" style="background: rgba(59, 130, 246, 0.08); padding: 12px; border-radius: 12px; border: 1px solid rgba(59, 130, 246, 0.3);">
                <label style="color: #60a5fa; font-weight: bold;">📋 Pending Orders:</label>
                <div id="adminPendingList" style="max-height: 180px; overflow-y: auto; color: var(--text-muted); font-size: 12px;">No pending orders</div>
            </div>

            <div class="form-group">
                <label>Order Execution Mode:</label>
                <select id="adminApprovalMode" class="form-control">
                    <option value="auto">Auto Execute on KD1S & Deduct Balance</option>
                    <option value="manual">Manual Admin Approval Before Deducting</option>
                </select>
            </div>
            <div class="form-group">
                <label>Profit Percentage (%):</label>
                <input type="number" step="1" id="adminProfitInput" class="form-control" value="40">
            </div>
            <div class="form-group">
                <label>QiCard Number:</label>
                <input type="text" id="adminQicardInput" class="form-control" value="2712238902">
            </div>
            <div class="form-group">
                <label>USDT (TRC20) Address:</label>
                <input type="text" id="adminUsdtInput" class="form-control" value="TFNmJNgXNy8DUFUTqLGARuJJbA9dUgeyCS">
            </div>
            <div class="form-group">
                <label>Admin Telegram ID:</label>
                <input type="text" id="adminChatIdInput" class="form-control" value="5341426561">
            </div>

            <button class="submit-btn" onclick="saveAdminSettings()">💾 Save Settings</button>
            <button onclick="closeAdminPanel()" style="width:100%; background:none; border:none; color:#ef4444; margin-top:10px; cursor:pointer; font-weight:bold;">Exit</button>
        </div>
    </div>

    <div class="container">
        <div class="lang-dropdown-wrapper">
            <button onclick="toggleLangMenu()" class="lang-drop-btn">
                🌐 <span id="currentLangTitle">العربية</span> ▼
            </button>
            <div id="langDropdownMenu" class="lang-content">
                <button onclick="setLang('ar')">العربية</button>
                <button onclick="setLang('ku')">کوردی (بادینی)</button>
                <button onclick="setLang('ckb')">کوردی (سۆرانی)</button>
                <button onclick="setLang('en')">English</button>
            </div>
        </div>

        <div class="header-top">
            <div class="balance-box-top" onclick="switchTab('refill')">
                <span>➕</span>
                <div>
                    <span id="txtBalance">رصيدك</span>
                    <h3 id="userBalance">$0.00</h3>
                </div>
            </div>
            <div class="profile-right">
                <div class="profile-info">
                    <div class="name" id="userNameDisplay">M7 Store</div>
                    <div class="id" id="userIdDisplay" onclick="copyTextValue(telegramId, this)">ID: ...</div>
                </div>
                <div class="profile-logo" id="userInitial" onclick="handleLogoClick()">M7</div>
            </div>
        </div>

        <div class="menu-buttons">
            <button class="menu-btn active" id="btnNewOrder" onclick="switchTab('order')">طلب جديد ⚡</button>
            <button class="menu-btn" id="btnRefill" onclick="switchTab('refill')">شحن رصيد 💳</button>
            <button class="menu-btn" id="btnHistory" onclick="switchTab('history')">سجلاتي 🕒</button>
        </div>

        <div id="orderSection">
            <div class="section-title" id="txtSelectPlatform">اختر المنصة:</div>
            <div class="platforms-grid">
                <div class="platform-card selected" onclick="selectPlatform('Instagram', this)">
                    <div class="platform-icon-box" style="background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: #fff;">
