<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M7 Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap');
        :root {
            --bg-deep: #05070b;
            --surface: rgba(19, 27, 46, 0.88);
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.55);
            --accent: #3b82f6;
            --success: #10b981;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            overflow-x: hidden;
        }
        #welcomeIntro {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, #1a103c 0%, #05070b 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 99999;
            animation: fadeOutIntro 0.6s ease 1s forwards;
            pointer-events: none;
        }
        .intro-logo {
            width: 84px; height: 84px;
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            border-radius: 24px; display: flex; align-items: center; justify-content: center;
            font-size: 36px; font-weight: 800; color: #fff;
            box-shadow: 0 0 35px var(--primary-glow);
        }
        .intro-title { margin-top: 16px; font-size: 24px; font-weight: 800; letter-spacing: 2px; }
        .intro-sub { font-size: 12px; color: #38bdf8; margin-top: 4px; letter-spacing: 2px; }
        @keyframes fadeOutIntro { to { opacity: 0; visibility: hidden; } }

        .container {
            max-width: 600px; margin: 0 auto;
            background: var(--surface);
            backdrop-filter: blur(20px);
            padding: 16px; border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }
        .lang-wrap { position: relative; display: inline-block; margin-bottom: 12px; }
        .lang-btn {
            background: rgba(26, 34, 56, 0.85); color: #fff;
            border: 1px solid var(--border); padding: 7px 14px;
            border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer;
        }
        .lang-menu {
            display: none; position: absolute; min-width: 120px;
            background: #131b2e; border: 1px solid var(--border);
            border-radius: 12px; z-index: 99; margin-top: 5px; overflow: hidden;
        }
        [dir="rtl"] .lang-menu { right: 0; }
        [dir="ltr"] .lang-menu { left: 0; }
        .lang-menu.show { display: block; }
        .lang-menu button {
            width: 100%; background: none; border: none; color: #fff;
            padding: 10px 14px; text-align: inherit; cursor: pointer; font-size: 12px; font-weight: 600;
        }
        .lang-menu button:hover { background: var(--primary); }

        .header-top {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(26, 34, 56, 0.75); padding: 14px 16px;
            border-radius: 18px; margin-bottom: 14px; border: 1px solid var(--border);
        }
        .balance-box {
            background: rgba(19, 27, 46, 0.95);
            border: 1px solid rgba(16, 185, 129, 0.45);
            padding: 8px 14px; border-radius: 14px;
            display: flex; align-items: center; gap: 10px; cursor: pointer;
        }
        .balance-box span.lbl { font-size: 11px; color: var(--text-muted); display: block; }
        .balance-box h3 { margin: 0; color: var(--success); font-size: 16px; font-weight: 800; }

        .profile-right { display: flex; align-items: center; gap: 10px; }
        .profile-logo {
            width: 46px; height: 46px;
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 18px; color: #fff; cursor: pointer; user-select: none;
        }
        .profile-info .name { font-weight: 700; font-size: 14px; }
        .profile-info .id { font-size: 12px; color: #38bdf8; font-weight: 700; cursor: pointer; margin-top: 2px; }

        .menu-buttons { display: flex; gap: 8px; margin-bottom: 16px; }
        .menu-btn {
            flex: 1; background: rgba(26, 34, 56, 0.75); color: var(--text-muted);
            border: 1px solid var(--border); padding: 12px 6px; border-radius: 14px;
            cursor: pointer; font-weight: 700; font-size: 12px; transition: 0.2s;
        }
        .menu-btn.active {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: #fff; border-color: var(--primary);
            box-shadow: 0 6px 18px rgba(124, 58, 237, 0.4);
        }

        .section-title { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; font-weight: 700; }
        .platforms-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 16px; }
        .platform-card {
            background: rgba(26, 34, 56, 0.65); border: 2px solid var(--border);
            border-radius: 16px; padding: 11px 6px; text-align: center; cursor: pointer; transition: 0.2s;
        }
        .platform-card.selected {
            border-color: var(--primary); background: rgba(34, 45, 74, 0.95);
            box-shadow: 0 0 18px rgba(139, 92, 246, 0.4);
        }
        .p-icon {
            width: 38px; height: 38px; margin: 0 auto 6px; border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
        }
        .p-icon svg { width: 21px; height: 21px; }
        .platform-card span.title { display: block; font-size: 11.5px; font-weight: 700; color: #fff; }

        .types-grid { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 4px; }
        .type-pill {
            background: rgba(26, 34, 56, 0.65); border: 1px solid var(--border);
            padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
            color: var(--text-muted); cursor: pointer; white-space: nowrap;
        }
        .type-pill.selected { background: var(--primary); color: #fff; border-color: var(--primary); }

        .card-box {
            background: rgba(26, 34, 56, 0.65); border: 1px solid var(--border);
            border-radius: 18px; padding: 16px; margin-bottom: 14px;
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 10px;
        }
        .form-group { margin-bottom: 13px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        .form-control {
            width: 100%; padding: 12px; background: rgba(13, 19, 33, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15); color: #fff;
            border-radius: 12px; font-size: 13px; outline: none; font-family: inherit;
        }
        .form-control:focus { border-color: var(--primary); }

        .details-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            background: rgba(13, 19, 33, 0.75); padding: 11px; border-radius: 14px;
            text-align: center; margin-top: 10px; border: 1px solid var(--border);
        }
        .details-grid div div:first-child { font-size: 10px; color: var(--text-muted); }
        .details-grid div div:last-child { font-size: 12px; font-weight: 700; color: var(--accent); margin-top: 4px; }

        .submit-btn {
            width: 100%; background: linear-gradient(135deg, #10b981, #059669);
            color: #fff; border: none; padding: 14px; border-radius: 14px;
            font-weight: 800; cursor: pointer; margin-top: 10px; font-size: 14px;
        }
        .submit-btn:disabled { opacity: 0.6; }

        .pay-box {
            background: rgba(13, 19, 33, 0.9); border: 1px solid var(--border);
            padding: 13px; border-radius: 14px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }
        .copy-btn {
            background: linear-gradient(135deg, #7c3aed, #3b82f6); color: #fff;
            border: none; padding: 8px 13px; border-radius: 10px;
            font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
        }
        .history-item {
            background: rgba(13, 19, 33, 0.88); border: 1px solid var(--border);
            border-radius: 14px; padding: 12px; margin-bottom: 10px; text-align: inherit;
        }
        #adminModal {
            display: none; position: fixed; inset: 0;
            background: rgba(5, 7, 11, 0.95); z-index: 999999;
            justify-content: center; align-items: center; padding: 12px;
        }
        .admin-box {
            background: #131b2e; border: 2px solid var(--primary);
            padding: 18px; border-radius: 20px; width: 100%; max-width: 430px;
            max-height: 90vh; overflow-y: auto;
        }
        .pend-card {
            background: rgba(13, 19, 33, 0.92); border: 1px solid var(--border);
            border-radius: 10px; padding: 10px; margin-bottom: 8px; font-size: 12px;
        }
        #msg { text-align: center; font-size: 12px; margin-top: 10px; font-weight: 700; }
    </style>
</head>
<body>

<div id="welcomeIntro">
    <div class="intro-logo">M7</div>
    <div class="intro-title">M7 STORE</div>
    <div class="intro-sub">NEXT-GEN DIGITAL HUB</div>
</div>

<div id="adminModal">
    <div class="admin-box">
        <h3 style="margin-top:0; color:var(--primary);">⚙️ Admin Panel (M7 Store)</h3>
        <div class="form-group" style="background:rgba(139,92,246,0.12); padding:10px; border-radius:12px;">
            <label style="color:#a78bfa;">➕ Add Balance by User ID:</label>
            <input type="text" id="targetUserId" class="form-control" placeholder="User Telegram ID" style="margin-bottom:6px;">
            <input type="number" step="0.5" id="addBalanceAmount" class="form-control" placeholder="Amount ($)" style="margin-bottom:6px;">
            <button class="submit-btn" style="padding:10px;" onclick="adminAddBalance()">Send Balance 🚀</button>
        </div>
        <div class="form-group">
            <label style="color:#60a5fa;">📋 Pending Orders:</label>
            <div id="adminPendingList" style="max-height:150px; overflow-y:auto; font-size:12px; color:var(--text-muted);">No pending orders</div>
        </div>
        <div class="form-group">
            <label>Order Mode:</label>
            <select id="adminApprovalMode" class="form-control">
                <option value="auto">Auto Execute & Deduct</option>
                <option value="manual">Manual Approval</option>
            </select>
        </div>
        <div class="form-group"><label>Profit (%):</label><input type="number" id="adminProfitInput" class="form-control" value="40"></div>
        <div class="form-group"><label>QiCard Number:</label><input type="text" id="adminQicardInput" class="form-control"></div>
        <div class="form-group"><label>USDT (TRC20) Address:</label><input type="text" id="adminUsdtInput" class="form-control"></div>
        <div class="form-group"><label>Bot Token:</label><input type="text" id="adminBotTokenInput" class="form-control"></div>
        <div class="form-group"><label>Admin Telegram ID:</label><input type="text" id="adminChatIdInput" class="form-control"></div>
        <button class="submit-btn" onclick="saveAdminSettings()">💾 Save Settings</button>
        <button onclick="document.getElementById('adminModal').style.display='none'" style="width:100%; background:none; border:none; color:#ef4444; margin-top:10px; cursor:pointer; font-weight:bold;">Exit</button>
    </div>
</div>

<div class="container">
    <div class="lang-wrap">
        <button onclick="document.getElementById('langMenu').classList.toggle('show')" class="lang-btn">
            🌐 <span id="currentLangTitle">العربية</span> ▼
        </button>
        <div id="langMenu" class="lang-menu">
            <button onclick="setLang('ar')">العربية</button>
            <button onclick="setLang('en')">English</button>
        </div>
    </div>

    <div class="header-top">
        <div class="balance-box" onclick="switchTab('refill')">
            <span>➕</span>
            <div>
                <span class="lbl" id="txtBalance">رصيدك</span>
                <h3 id="userBalance">$0.00</h3>
            </div>
        </div>
        <div class="profile-right">
            <div class="profile-info">
                <div class="name" id="userNameDisplay">M7 Store</div>
                <div class="id" id="userIdDisplay" onclick="copyTextValue(telegramId, this)">ID: ...</div>
            </div>
            <div class="profile-logo" onclick="handleLogoClick()">M7</div>
        </div>
    </div>

    <div class="menu-buttons">
        <button class="menu-btn active" id="btnNewOrder" onclick="switchTab('order')">طلب جديد ⚡</button>
        <button class="menu-btn" id="btnRefill" onclick="switchTab('refill')">شحن رصيد 💳</button>
        <button class="menu-btn" id="btnHistory" onclick="switchTab('history')">سجلاتي 🕒</button>
    </div>

    <!-- Order Section -->
    <div id="orderSection">
        <div class="section-title" id="txtSelectPlatform">اختر المنصة:</div>
        <div class="platforms-grid">
            <div class="platform-card selected" onclick="selectPlatform('Instagram', this)">
                <div class="p-icon" style="background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); color:#fff;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>
                </div>
                <span class="title" id="pInsta">إنستغرام</span>
            </div>
            <div class="platform-card" onclick="selectPlatform('TikTok', this)">
                <div class="p-icon" style="background:#000000; color:#ffffff; border:1px solid rgba(255,255,255,0.2);">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.3 0 .59.04.88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
                </div>
                <span class="title" id="pTiktok">تيك توك</span>
            </div>
            <div class="platform-card" onclick="selectPlatform('Telegram', this)">
                <div class="p-icon" style="background:#229ED9; color:#ffffff;">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.665 3.717l-17.73 6.837c-1.21.486-1.203 1.161-.222 1.462l4.552 1.42 10.532-6.645c.498-.303.953-.14.579.192l-8.533 7.701-.314 4.692c.46 0 .663-.211.921-.46l2.211-2.15 4.599 3.397c.848.467 1.457.227 1.668-.785l3.019-14.228c.309-1.239-.473-1.8-1.282-1.434z"/></svg>
                </div>
                <span class="title" id="pTelegram">تيليجرام</span>
            </div>
            <div class="platform-card" onclick="selectPlatform('YouTube', this)">
                <div class="p-icon" style="background:#FF0000; color:#ffffff;">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.5 31.5 0 0 0 0 12a31.5 31.5 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.5 31.5 0 0 0 24 12a31.5 31.5 0 0 0-.5-5.8zM9.6 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg>
                </div>
                <span class="title" id="pYoutube">يوتيوب</span>
            </div>
            <div class="platform-card" onclick="selectPlatform('Facebook', this)">
                <div class="p-icon" style="background:#1877F2; color:#ffffff;">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14c-.326-.043-1.557-.14-2.857-.14C11.928 2 10 3.657 10 6.7v2.8H7v4h3V22h4v-8.5z"/></svg>
                </div>
                <span class="title" id="pFacebook">فيسبوك</span>
            </div>
            <div class="platform-card" onclick="selectPlatform('Snapchat', this)">
                <div class="p-icon" style="background:#FFFC00; color:#000000;">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c-3.1 0-5.4 2.2-5.4 5.4 0 .9.2 1.8.3 2.5-.3.1-.7.2-1 .2-.6 0-1.1.3-1.1.8 0 .5.5.8 1.2 1.1.5.2.9.4.8.9-.2.9-1.5 2.4-3.6 2.9-.5.1-.7.5-.6.9.2.6 1.2 1.1 3 1.4.2.4.3 1.1.8 1.1.4 0 .9-.2 1.7-.2.9 0 1.7.7 3.7.7s2.8-.7 3.7-.7c.8 0 1.3.2 1.7.2.5 0 .6-.7.8-1.1 1.8-.3 2.8-.8 3-1.4.1-.4-.1-.8-.6-.9-2.1-.5-3.4-2-3.6-2.9-.1-.5.3-.7.8-.9.7-.3 1.2-.6 1.2-1.1 0-.5-.5-.8-1.1-.8-.3 0-.7-.1-1-.2.1-.7.3-1.6.3-2.5C17.4 4.2 15.1 2 12 2z"/></svg>
                </div>
                <span class="title" id="pSnapchat">سناب شات</span>
            </div>
            <div class="platform-card" onclick="selectPlatform('Twitter', this)">
                <div class="p-icon" style="background:#0f1419; color:#ffffff; border:1px solid rgba(255,255,255,0.2);">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                </div>
                <span class="title" id="pTwitter">تويتر / X</span>
            </div>
            <div class="platform-card" onclick="selectPlatform('WhatsApp', this)">
                <div class="p-icon" style="background:#25D366; color:#ffffff;">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.5 14.2c-.2.6-1.3 1.2-1.8 1.3-.5.1-1.1.1-1.8-.1-1.6-.5-3.5-1.8-4.8-3.5-1.1-1.4-1.6-2.7-1.6-3.7 0-1 .5-1.5.8-1.8.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 1.9c.1.2.1.4 0 .6l-.4.6c-.1.2-.2.3-.1.5.4.7 1 1.4 1.7 2 .8.6 1.5.9 2.1 1.1.2.1.4 0 .5-.1l.6-.7c.2-.2.4-.2.6-.1l1.8.9c.2.1.4.2.4.4 0 .2-.1.7-.3 1.2z"/></svg>
                </div>
                <span class="title" id="pWhatsapp">واتساب</span>
            </div>
            <div class="platform-card" onclick="selectPlatform('All', this)">
                <div class="p-icon" style="background:#475569; color:#ffffff;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                </div>
                <span class="title" id="pAll">الكل / عام</span>
            </div>
        </div>

        <div class="section-title" id="txtSelectType">اختر نوع الخدمة:</div>
        <div class="types-grid" id="typesContainer"></div>

        <div class="form-group">
            <input type="text" id="serviceSearch" class="form-control" placeholder="🔍 ابحث باسم الخدمة أو الرقم..." oninput="renderCategoriesAndServices()">
        </div>

        <div class="form-group">
            <label id="txtCategoryLabel">القسم (Category):</label>
            <select id="categorySelect" class="form-control" onchange="renderServicesOnly()">
                <option value="">جاري تحميل الأقسام...</option>
            </selec
