<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M7 Store - SMM Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #ffffff;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            direction: rtl;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 15px;
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            cursor: pointer;
        }
        .header h1 {
            margin: 0;
            font-size: 22px;
            color: var(--accent-color);
        }
        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #94a3b8;
        }
        select, input {
            width: 100%;
            padding: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            background-color: var(--accent-color);
            color: #0f172a;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: var(--accent-hover);
        }
        #notification {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo / Header -->
        <div class="header" onclick="checkAdminTrigger()">
            <h1>M7 Store ⚡</h1>
            <p style="margin: 5px 0 0 0; font-size: 12px; color: #94a3b8;">خزمەتگوزاریێن سوشیاڵ مێدیا</p>
        </div>

        <!-- Order Form Card -->
        <div class="card">
            <h3 style="margin-top: 0; font-size: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">إنشاء طلب جديد</h3>
            
            <div class="form-group">
                <label>البحث عن الخدمة:</label>
                <input type="text" id="searchInput" placeholder="ابحث باسم الخدمة أو الرقم..." onkeyup="filterServices()">
            </div>

            <div class="form-group">
                <label>التصنيف (Category):</label>
                <select id="categorySelect" onchange="updateServices()">
                    <option value="">الكل (مرتب)</option>
                </select>
            </div>

            <div class="form-group">
                <label>الخدمة (Service):</label>
                <select id="serviceSelect" onchange="updateServiceDetails()">
                    <option value="">اختر الخدمة أولاً...</option>
                </select>
            </div>

            <div class="form-group">
                <label>الرابط (Link):</label>
                <input type="url" id="orderLink" placeholder="https://...">
            </div>

            <div class="form-group">
                <label>الكمية (Quantity):</label>
                <input type="number" id="orderQuantity" value="1000" min="10">
            </div>

            <button class="btn" onclick="submitOrder()">تثبيت الطلب</button>
            <div id="notification"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const API_URL = window.location.origin;
        let allServices = [];

        // بارکرنا خزمەتگوزارییان ژ سێرڤەری
        async function fetchServices() {
            try {
                const res = await fetch(`${API_URL}/api/services`);
                allServices = await res.json();
                populateCategories();
            } catch (err) {
                console.error("Error fetching services:", err);
                document.getElementById('notification').innerText = "❌ تعذر الاتصال بالسيرفر، تأكد من تشغيل Vercel";
                document.getElementById('notification').style.color = "#f87171";
            }
        }

        function populateCategories() {
            const catSelect = document.getElementById('categorySelect');
            const categories = [...new Set(allServices.map(s => s.category))];
            
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                catSelect.appendChild(opt);
            });
            updateServices();
        }

        function updateServices() {
            const selectedCat = document.getElementById('categorySelect').value;
            const serviceSelect = document.getElementById('serviceSelect');
            serviceSelect.innerHTML = '';

            const filtered = selectedCat ? allServices.filter(s => s.category === selectedCat) : allServices;

            filtered.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.service;
                opt.textContent = `${s.service} - ${s.name} (${s.rate}$ / 1000)`;
                serviceSelect.appendChild(opt);
            });
        }

        function filterServices() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const serviceSelect = document.getElementById('serviceSelect');
            serviceSelect.innerHTML = '';

            const filtered = allServices.filter(s => s.name.toLowerCase().includes(query) || s.service.toString().includes(query));

            filtered.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.service;
                opt.textContent = `${s.service} - ${s.name} (${s.rate}$ / 1000)`;
                serviceSelect.appendChild(opt);
            });
        }

        async function submitOrder() {
            const serviceId = document.getElementById('serviceSelect').value;
            const link = document.getElementById('orderLink').value;
            const quantity = document.getElementById('orderQuantity').value;
            const notif = document.getElementById('notification');

            if (!link || !serviceId) {
                notif.innerText = "⚠️ تکایە هەمی خانەیان پڕ بکە!";
                notif.style.color = "#facc15";
                return;
            }

            notif.innerText = "⏳ جارە چاوەڕێ بە، داواکاری تێدەپەڕێت...";
            notif.style.color = "#38bdf8";

            try {
                const res = await fetch(`${API_URL}/api/order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: tg.initDataUnsafe?.user?.id || 123456,
                        service: serviceId,
                        link: link,
                        quantity: quantity
                    })
                });
                const data = await res.json();

                if (res.ok) {
                    notif.innerText = "✅ داواکاری ب سەرکەفتیانە هاتە هنارتن!";
                    notif.style.color = "#4ade80";
                } else {
                    notif.innerText = `❌ هەلە: ${data.error || 'نکارست داواکاری بنێرێت'}`;
                    notif.style.color = "#f87171";
                }
            } catch (err) {
                notif.innerText = "❌ تعذر الاتصال بالسيرفر";
                notif.style.color = "#f87171";
            }
        }

        let clickCount = 0;
        function checkAdminTrigger() {
            clickCount++;
            if (clickCount >= 5) {
                alert("پەنێلی ئەدمن لێرە دکرێتەوە (یان پاسوۆرد داخواز بکە)");
                clickCount = 0;
            }
        }

        window.onload = fetchServices;
    </script>
</body>
</html>
